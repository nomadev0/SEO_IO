[project]
name = "seo-pro-ai"
version = "0.1.0"
description = "Local AI microservice powering SEO PRO intelligent features."
authors = [{name = "SEO PRO"}]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "llama-cpp-python>=0.2.60",
  "scikit-learn",
  "numpy",
]
requires-python = ">=3.11"

[project.optional-dependencies]
summaries = ["transformers", "torch"]

[project.scripts]
seo-pro-ai = "ai_service.app:main"

[tool.setuptools.packages.find]
where = ["ai_service"]
